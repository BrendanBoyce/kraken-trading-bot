[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kraken-market-bot"
version = "0.3.0"
description = "Public Kraken market-data foundation"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11,<4", "duckdb>=1.4,<2", "pytz>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
research = ["numpy>=2,<3", "scikit-learn>=1.7,<2"]

[project.scripts]
kraken-bot = "kraken_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
